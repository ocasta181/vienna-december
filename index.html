<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vienna, December 2026</title>
<meta name="description" content="Concerts, opera, ballet and dances in Vienna, 12 to 20 December 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --panel-2:#1a2431;
  --brass-dim:#8a7346;
  --concert:#c9a464;
  --opera:#d47a68;
  --ballet:#8eaccf;
  --dance:#8fb79b;
  --ink:#0e141c;
  --panel:#141c27;
  --line:#263243;
  --row:#1d2734;
  --text:#ebe4d6;
  --muted:#9aa3ad;
  --brass:#c9a464;
  --serif:"Cormorant Garamond",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
button,select,input{font:inherit;color:inherit}

.hero{position:relative;min-height:min(72vh,680px);display:flex;align-items:flex-end;
  background:linear-gradient(180deg,rgba(14,20,28,.15) 0%,rgba(14,20,28,0) 35%,rgba(14,20,28,.55) 75%,var(--ink) 100%),
  url("img/rathaus.jpg") center 30%/cover no-repeat;border-bottom:1px solid var(--line)}
.hero-inner{max-width:1180px;width:100%;margin:0 auto;padding:0 24px 40px}
.eyebrow{text-shadow:0 1px 8px rgba(0,0,0,.6);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--brass)}
h1{font-family:var(--serif);font-weight:500;text-shadow:0 2px 24px rgba(0,0,0,.5);font-size:clamp(44px,7vw,80px);line-height:1;margin:14px 0 0}

main{max-width:1180px;margin:0 auto;padding:28px 24px 80px}
.controls{position:sticky;top:0;z-index:20;background:rgba(14,20,28,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  margin:0 -24px;padding:16px 24px 14px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row + .row{margin-top:10px}
.search{flex:1 1 160px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 16px;color:var(--text);font:inherit;outline:none}
.search:focus{border-color:var(--brass-dim)}
.search::placeholder{color:#6d7782}
select.sort{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:9px 14px;color:var(--text);font:inherit}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}

.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:13px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
.chip:hover{border-color:#3b4a5e}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--brass))}
.chip .n{color:var(--muted);font-size:12px}
.chip[aria-pressed="true"]{background:var(--panel-2);border-color:var(--c,var(--brass));}
.chip[aria-pressed="true"] .n{color:var(--text)}
.chip.ghost{background:transparent}
.days{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{flex-direction:column;gap:0;padding:5px 12px;line-height:1.15;border-radius:8px;min-width:64px}
.chip.zero{opacity:.4}
.day small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.day b{font-family:var(--serif);font-size:19px;font-weight:600}


@media (max-width:900px){.controls{position:static;margin:0 -16px;padding:12px 16px}}
.cat{--c:var(--muted)}

table{width:100%;border-collapse:collapse}
thead th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
thead th:first-child{width:30%}
th button{all:unset;cursor:pointer}
th button:focus-visible{outline:1px solid var(--brass);outline-offset:3px}
th .arrow{display:inline-block;width:10px;margin-left:4px;color:var(--brass);font-size:9px}
tbody td{padding:14px 10px;border-bottom:1px solid var(--row);vertical-align:middle}
.title{font-family:var(--serif);font-size:20px;font-weight:600;line-height:1.2;text-decoration:none}
.title:hover{color:var(--brass)}
.venue{color:var(--muted);text-decoration:none;border-bottom:1px dotted #46525f}
.venue:hover{color:var(--text)}
.cat{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);text-transform:capitalize;white-space:nowrap}
.nw{white-space:nowrap;font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .hero{min-height:56vh}
  .hero-inner{padding:0 16px 28px}
  main{padding:20px 16px 60px}
  thead{display:none}
  table,tbody{display:block;width:100%}
  tbody tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;border-bottom:1px solid var(--row);padding:16px 0}
  tbody td{display:block;border:0;padding:0}
  td.c-ev{order:1;flex:1 1 100%}
  td.c-ven{order:2;flex:1 1 100%;margin-bottom:2px}
  td.c-date{order:3}
  td.c-time{order:4}
  td.c-dur{order:5;color:var(--muted)}
  td.c-cost{order:6}
  td.c-cat{order:7;margin-left:auto}
  td.c-fit{order:8}
  td.c-fit::after{content:"/10";color:var(--muted)}
}
</style>
</head>
<body>

<!-- Photo: "Rathaus Christkindlmarkt" by Max Pfandl, CC BY 2.0 (https://creativecommons.org/licenses/by/2.0), via Wikimedia Commons -->
<header class="hero" role="img" aria-label="Vienna City Hall and Christmas market in snow at dusk" title="Photo: Max Pfandl, CC BY 2.0">
  <div class="hero-inner">
    <div class="eyebrow">12 – 20 December 2026</div>
    <h1>Vienna</h1>
  </div>
</header>

<main>
  <div class="controls" role="region" aria-label="Filters">
    <div class="row">
      <input class="search" id="q" type="search" placeholder="Search events, venues, composers…" aria-label="Search">
      <select class="sort" id="sortSel" aria-label="Sort by">
        <option value="date:asc">Sort: Date</option>
        <option value="fit:desc">Sort: Best fit</option>
        <option value="cost:asc">Sort: Cheapest</option>
        <option value="dur:asc">Sort: Shortest</option>
        <option value="title:asc">Sort: A to Z</option>
      </select>
    </div>
    <div class="row" id="cats"></div>
    <div class="row days" id="days"></div>
  </div>
  <div style="height:16px"></div>
  <table>
    <thead>
      <tr>
        <th data-key="title"><button>Event<span class="arrow"></span></button></th>
        <th data-key="cat"><button>Category<span class="arrow"></span></button></th>
        <th data-key="venue"><button>Venue<span class="arrow"></span></button></th>
        <th data-key="cost"><button>Cost (USD)<span class="arrow"></span></button></th>
        <th data-key="date"><button>Date<span class="arrow"></span></button></th>
        <th data-key="time"><button>Time<span class="arrow"></span></button></th>
        <th data-key="dur"><button>Duration<span class="arrow"></span></button></th>
        <th data-key="fit"><button>Fit<span class="arrow"></span></button></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</main>

<script>
const M = q => "https://www.google.com/maps/search/?api=1&query=" + q;
const V = {
  mv:  ["Musikverein", M("Musikverein+Wien%2C+Musikvereinsplatz+1%2C+1010+Wien&query_place_id=ChIJx-raUZ0HbUcRT4MxN8ArwYI")],
  wag: ["Tanzschule Prof. Wagner", M("Dance+School+Prof.+Wagner%2C+Fleischmarkt+3-5%2C+1010+Wien&query_place_id=ChIJr-U5NaAHbUcRV2nd0BwkOWQ")],
  bab: ["Babenbergerhalle Klosterneuburg", M("Babenbergerhalle+Klosterneuburg%2C+Rathauspl.+25%2C+3400+Klosterneuburg&query_place_id=ChIJ1VV0GhwPbUcRzKBIAwNqxOU")],
  sto: ["Vienna State Opera", M("Vienna+State+Opera%2C+Opernring+2%2C+1010+Wien&query_place_id=ChIJ1b8dhpwHbUcRVn03JY0mWf0")],
  wop: ["Tanzschule Wopienka", M("Tanzschule+Wopienka%2C+Sch%C3%B6mergasse+1%2C+3400+Klosterneuburg&query_place_id=ChIJbQTTgjKnDwkRbu0p8vQ9yF4")],
  kh:  ["Wiener Konzerthaus", M("Wiener+Konzerthaus%2C+Lothringerstra%C3%9Fe+20%2C+1030+Wien&query_place_id=ChIJne2spncHbUcRp1OkDtn2HrA")],
  cas: ["Casino Baden", M("Casino+Baden%2C+Kaiser+Franz-Ring+1%2C+2500+Baden&query_place_id=ChIJibimkGCwbUcRW-4gqwqn7Hg")],
  hbk: ["Hofburgkapelle", M("Wiener+Hofburgkapelle%2C+Hofburg+-+Schweizerhof%2C+1010+Wien&query_place_id=ChIJ3wYgv5kHbUcR46yqY8H1mg8")],
};
const MV = id => "https://shop.musikverein.at/selection/event/seat?perfId=" + id;
const WO = id => "https://wotanzen.at/veranstaltung/details/" + id;
const SO = (slug, d) => `https://www.wiener-staatsoper.at/en/calendar/detail/${slug}/2026-12-${d}/`;

// [title, url, category, venue, cost, date, time, duration, fit]
const RAW = [
 ["Vienna Philharmonic, Britten War Requiem", MV("10229728116903"), "concert","mv","$13 to $218","Sat Dec 12","15:30","1h30",10],
 ["Perfektion practice evening, Tanzschule Prof. Wagner", WO(98654), "dance","wag","$9","Sat Dec 12","18:00","3h",7],
 ["Weihnachtsball, Klosterneuburg", "https://www.antanzen.at/weihnachtsball/", "dance","bab","$40 to $51","Sat Dec 12","19:30","7h30",9],
 ["Vienna Symphony, Elim Chan, Leif Ove Andsnes", MV("10229683392105"), "concert","mv","$13 to $147","Sat Dec 12","19:30","2h",8],
 ["Orchester Wiener Akademie, Haselböck", MV("10229691933778"), "concert","mv","$13 to $99","Sun Dec 13","15:30","2h",7],
 ["Perfektion practice evening, Tanzschule Prof. Wagner", WO(98616), "dance","wag","$9","Sun Dec 13","18:00","2h",6],
 ["Musikverein Orchesterverein", MV("10229763935548"), "concert","mv","$10 to $64","Sun Dec 13","19:30","2h",5],
 ["Onegin", SO("onegin",14), "ballet","sto","$15 to $228","Mon Dec 14","20:00","2h15",7],
 ["Tanzcafé, Tanzschule Wopienka", WO(98705), "dance","wop","$9","Tue Dec 15","16:00","2h",5],
 ["Die Zauberflöte (The Magic Flute)", SO("die-zauberfloete",15), "opera","sto","$21 to $292","Tue Dec 15","18:30","3h15",8],
 ["Christmas at the Musikverein, Cappella Istropolitana", MV("10229753219045"), "concert","mv","$22 to $131","Tue Dec 15","19:30","2h30",6],
 ["Anne-Sophie Mutter with Soltani and Rana", MV("10229710774000"), "concert","mv","$13 to $154","Wed Dec 16","19:30","2h",9],
 ["Onegin", SO("onegin",16), "ballet","sto","$15 to $228","Wed Dec 16","20:00","2h15",7],
 ["La Damnation de Faust (premiere)", SO("la-damnation-de-faust",17), "opera","sto","$21 to $338","Thu Dec 17","19:00","3h",8],
 ["Mahler Symphony No. 3, UNICEF (United Nations Children's Fund) benefit", MV("10229869075030"), "concert","mv","$11 to $132","Thu Dec 17","19:30","1h45",8],
 ["Vienna Philharmonic, Mäkelä, Rite of Spring", "https://www.wienerphilharmoniker.at/en/konzerte/concert-in-the-wiener-konzerthaus/10918/", "concert","kh","","Fri Dec 18","19:30","about 1h30",10],
 ["Tonkünstler Orchestra, Jussen brothers", MV("10229765577505"), "concert","mv","$10 to $74","Fri Dec 18","19:30","1h45",7],
 ["Vienna Mozart Orchestra", MV("10229820722512"), "concert","mv","$76 to $153","Fri Dec 18","20:15","1h50",5],
 ["Kekserlduft & Kerzenschein, Casino Baden", "https://www.city-dancing.at/termin/casino_2612.html", "dance","cas","$44","Sat Dec 19","18:30","about 5h",8],
 ["Handel, Arnold Schoenberg Choir", MV("10229753141708"), "concert","mv","$13 to $149","Sat Dec 19","19:00","3h10",9],
 ["Dancenight, Tanzschule Wopienka", WO(98723), "dance","wop","","Sat Dec 19","19:00","3h",6],
 ["Camerata Classica, Four Seasons", MV("10229821419109"), "concert","mv","$17 to $91","Sat Dec 19","20:00","2h",5],
 ["Ausgerechnet Weihnachten, Fritz Karl with Sonare Quartet", MV("10229733502928"), "concert","mv","$9 to $41","Sat Dec 19","20:00","2h",4],
 ["Vienna Boys Choir, Sunday Mass", "https://www.viennaclassic.com/en/vienna/concert/vienna-boys-choir-at-hofmusikkapelle/z16P9MKr", "concert","hbk","$61 to $80","Sun Dec 20","09:15","about 2h",8],
 ["Tonkünstler Orchestra, Jussen brothers (matinee)", MV("10229765572652"), "concert","mv","$10 to $74","Sun Dec 20","15:30","1h45",7],
 ["Bach Christmas Oratorio, Vienna Symphony", "https://konzerthaus.at/en/program-and-tickets/wiener-symphoniker-wiener-singakademie-de-marchi/63698", "concert","kh","$8 to $143","Sun Dec 20","19:00","1h50",9],
 ["Vienna Philharmonic ensemble, Bruckner and Brahms", MV("10229719673110"), "concert","mv","$13 to $77","Sun Dec 20","19:30","2h",9],
 ["St. Augustin Choir and Orchestra, Mozart and Rheinberger", MV("10229789927223"), "concert","mv","$22 to $98","Sun Dec 20","19:30","2h",6],
 ["Chopin Gala, Pietro Massa", MV("10229863760510"), "concert","mv","$11 to $39","Sun Dec 20","19:30","2h30",5],
];

const EVENTS = RAW.map(([title,url,cat,v,cost,date,time,dur,fit]) => {
  const d = dur.match(/(\d+)h(\d+)?/);
  const c = cost.match(/\d+/);
  return { title,url,cat,venue:V[v][0],venueUrl:V[v][1],cost,date,time,dur,fit,
    day:+date.slice(-2), mins:+d[1]*60+(+(d[2]||0)), lo:c?+c[0]:Infinity };
});
const CATS = ["concert","opera","ballet","dance"];
const state = { q:"", cats:new Set(), days:new Set(), sort:"date", dir:1 };
const DOW = d => EVENTS.find(e=>e.day===d).date.slice(0,3);
const norm = t => t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const KEY = {
  title:e=>e.title.toLowerCase(), cat:e=>e.cat, venue:e=>e.venue, cost:e=>e.lo,
  date:e=>e.day*10000 + +e.time.replace(":",""), time:e=>e.time, dur:e=>e.mins, fit:e=>e.fit,
};

const matchQ = e => { const q = norm(state.q).trim(); return !q || q.split(/\s+/).every(w => norm(e.title+" "+e.venue+" "+e.cat).includes(w)); };
const matchCat = e => !state.cats.size || state.cats.has(e.cat);
const matchDay = e => !state.days.size || state.days.has(e.day);

function renderCats(){
  const pool = EVENTS.filter(e => matchQ(e) && matchDay(e));
  const n = c => pool.filter(e=>e.cat===c).length;
  $("#cats").innerHTML = `<span class="label">Type</span>` +
    `<button class="chip" data-cat="" aria-pressed="${!state.cats.size}">All <span class="n">${pool.length}</span></button>` +
    CATS.map(c=>`<button class="chip${n(c)?"":" zero"}" data-cat="${c}" style="--c:var(--${c})" aria-pressed="${state.cats.has(c)}"><span class="dot"></span>${c[0].toUpperCase()+c.slice(1)} <span class="n">${n(c)}</span></button>`).join("");
}
function renderDays(){
  const pool = EVENTS.filter(e => matchQ(e) && matchCat(e));
  const days = [...new Set(EVENTS.map(e=>e.day))];
  const n = d => pool.filter(e=>e.day===d).length;
  $("#days").innerHTML = `<span class="label">Day</span>` +
    `<button class="chip day" data-day="" aria-pressed="${!state.days.size}"><small>All</small><b>${pool.length}</b></button>` +
    days.map(d=>`<button class="chip day${n(d)?"":" zero"}" data-day="${d}" aria-pressed="${state.days.has(d)}"><small>${DOW(d)} ${d}</small><b>${n(d)}</b></button>`).join("");
}

function render(){
  const k = KEY[state.sort], tie = KEY.date;
  renderCats(); renderDays();
  const list = EVENTS.filter(e => matchQ(e) && matchCat(e) && matchDay(e))
    .sort((a,b) => {
      const x=k(a), y=k(b);
      if(x===Infinity || y===Infinity) return x===y ? tie(a)-tie(b) : x===Infinity ? 1 : -1;
      return (x<y?-1:x>y?1:0)*state.dir || tie(a)-tie(b);
    });
  $("#rows").innerHTML = list.map(e => `<tr>
    <td class="c-ev"><a class="title" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td>
    <td class="c-cat"><span class="cat">${e.cat}</span></td>
    <td class="c-ven"><a class="venue" href="${esc(e.venueUrl)}" target="_blank" rel="noopener">${esc(e.venue)}</a></td>
    <td class="c-cost nw">${e.cost}</td>
    <td class="c-date">${e.date}</td>
    <td class="c-time nw">${e.time}</td>
    <td class="c-dur nw">${e.dur}</td>
    <td class="c-fit nw">${e.fit}</td>
  </tr>`).join("");
  document.querySelectorAll("th[data-key]").forEach(th => {
    const on = th.dataset.key===state.sort;
    th.setAttribute("aria-sort", on ? (state.dir>0?"ascending":"descending") : "none");
    th.querySelector(".arrow").textContent = on ? (state.dir>0?"▲":"▼") : "";
  });
  const sv = `${state.sort}:${state.dir>0?"asc":"desc"}`;
  $("#sortSel").value = sv;
  if($("#sortSel").value!==sv) $("#sortSel").selectedIndex = -1;
}

$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]"); if(!b) return;
  const c = b.dataset.cat;
  if(!c) state.cats.clear(); else state.cats.has(c) ? state.cats.delete(c) : state.cats.add(c);
  render();
});
document.querySelectorAll("th[data-key] button").forEach(b => b.addEventListener("click", () => {
  const k = b.parentElement.dataset.key;
  if(state.sort===k) state.dir *= -1; else { state.sort = k; state.dir = k==="fit" ? -1 : 1; }
  render();
}));

$("#days").addEventListener("click", e => {
  const b = e.target.closest("[data-day]"); if(!b) return;
  const d = +b.dataset.day;
  if(!d) state.days.clear(); else state.days.has(d) ? state.days.delete(d) : state.days.add(d);
  render();
});
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#sortSel").addEventListener("change", e => { const [k,d] = e.target.value.split(":"); state.sort = k; state.dir = d==="asc"?1:-1; render(); });

render();
</script>
</body>
</html>
